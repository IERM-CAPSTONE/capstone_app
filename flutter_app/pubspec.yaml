name: flutter_app
description: Flutter app for exam room management with attendance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Camera
  camera: ^0.10.5+5
  image_picker: ^1.0.5
  
  # Firebase & Authentication (latest versions with Pigeon fixes)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  
  # Google Sign In - using version 6.x for stable API
  google_sign_in: ^6.2.1
  
  # URL Launcher & Web
  url_launcher: ^6.2.5
  webview_flutter: ^4.4.2
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.20.2
  device_preview: ^1.2.0
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0
  flutter_localizations:
    sdk: flutter
  
  # Code Generation
  json_annotation: ^4.8.1
  google_mlkit_face_detection: ^0.13.1
  
  # ML & Image Processing
  # tflite: ^1.1.2  # Temporarily disabled due to compatibility issues
  image: ^4.1.3
  
  # Encryption
  crypto: ^3.0.3
  encrypt: ^5.0.3
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: 8.2.0
  riverpod_generator: ^2.3.9
  

  
flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/avatar_face.png
    - assets/models/
    - assets/
