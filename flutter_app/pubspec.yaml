name: flutter_app
description: Flutter app for exam room management with attendance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Camera
  camera: ^0.10.5+5
  image_picker: ^1.0.5
  
  # Firebase & Authentication
  firebase_core: ^2.24.0
  firebase_auth: ^4.13.0
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # URL Launcher
  url_launcher: ^6.2.5
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.19.0
  
  # Code Generation
  json_annotation: ^4.8.1
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/avatar_face.png
    - assets/

